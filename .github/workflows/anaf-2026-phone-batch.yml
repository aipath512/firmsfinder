name: SCARA ANAF 2026 — retrieve phone numbers (one batch)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/anaf_2026_phone_batch.py'
      - '.github/workflows/anaf-2026-phone-batch.yml'
permissions:
  contents: read
concurrency:
  group: scara-anaf-2026-batch
  cancel-in-progress: false
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
      CF_D1_WRITE_TOKEN: ${{ secrets.CF_D1_WRITE_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve next 100 ONRC 2026 CUIs from ANAF and store phone candidates
        run: python3 tools/anaf_2026_phone_batch.py
      - name: Upload batch report (aggregate counts only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anaf-2026-phone-batch-report
          path: anaf-2026-batch-report.json
          if-no-files-found: ignore
          retention-days: 7
