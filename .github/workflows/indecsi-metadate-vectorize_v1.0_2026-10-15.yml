name: Indecsi metadate Vectorize
on: workflow_dispatch
jobs:
  indecsi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: caen (text)
        run: npx --yes wrangler@latest vectorize create-metadata-index firmsfinder-firme --propertyName=caen --type=string
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: judet (text)
        run: npx --yes wrangler@latest vectorize create-metadata-index firmsfinder-firme --propertyName=judet --type=string
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: sal (numar)
        run: npx --yes wrangler@latest vectorize create-metadata-index firmsfinder-firme --propertyName=sal --type=number
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: ca (numar)
        run: npx --yes wrangler@latest vectorize create-metadata-index firmsfinder-firme --propertyName=ca --type=number
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: lista indecsi
        run: npx --yes wrangler@latest vectorize list-metadata-index firmsfinder-firme
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
