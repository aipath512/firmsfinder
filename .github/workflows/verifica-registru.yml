# verifica-registru.yml — v1.0 (2026-10-29)
# Locul în GitHub: .github/workflows/verifica-registru.yml
# La fiecare push care atinge dicționarul, registrul sau scripturile, compară
# fișierele înghețate cu amprentele din registru și latest.json cu registrul.
# Dă eroare (X roșu în Actions) dacă ceva nu corespunde; nu blochează push-ul.
name: verifica-registru

on:
  push:
    paths:
      - "dictionar/**"
      - "sesiuni/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - name: Descarcă depozitul
        uses: actions/checkout@v4

      - name: Instalează Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verifică registrul
        run: python scripts/ingheata_sesiune.py verifica
