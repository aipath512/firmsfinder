name: Apply 2026 contacts index in D1
on:
  push:
    branches: [main]
    paths:
      - 'migrations/2026_firme_site_cui_index.sql'
      - '.github/workflows/apply-2026-contacts-index.yml'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: 2026-d1-contact-index
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.GEO100_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check D1 migration credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::D1 write token or account missing"; exit 1; }
      - name: Create missing contact-CUI index
        run: npx --yes wrangler@4 d1 execute b2b-romania-db --remote --file=migrations/2026_firme_site_cui_index.sql
      - name: Verify index is present
        run: npx --yes wrangler@4 d1 execute b2b-romania-db --remote --command="PRAGMA index_list('firme_site');"
      - name: Link exact run to commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request
          body={"context":"firmsfinder/d1-2026-contact-index",
                "state":"success" if os.environ["GH_JOB_STATUS"]=="success" else "failure",
                "description":"firme_site CUI index migration",
                "target_url":"https://github.com/"+os.environ["GH_REPO"]+"/actions/runs/"+os.environ["GH_RUN_ID"]}
          req=urllib.request.Request("https://api.github.com/repos/"+os.environ["GH_REPO"]+"/statuses/"+os.environ["GH_SHA"],
              data=json.dumps(body).encode(),method="POST",headers={
                "Authorization":"Bearer "+os.environ["GH_TOKEN"],
                "Accept":"application/vnd.github+json","Content-Type":"application/json",
                "User-Agent":"AiVenture-D1-Migration"})
          with urllib.request.urlopen(req,timeout=20) as r:print("COMMIT_STATUS",r.status)
          PY
