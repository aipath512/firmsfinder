name: Inspect 2026 D1 query plans
on:
  push:
    branches: [main]
    paths:
      - 'functions/api/companies/d1-plan.js'
      - '.github/workflows/inspect-2026-d1-plan.yml'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read production query planner and indexes
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json,time
          url="https://firmsfinder.eu/api/companies/d1-plan"
          for i in range(6):
              try:
                  req=urllib.request.Request(url,headers={"Accept":"application/json","User-Agent":"AiVenture-QueryPlan-Inspector/1.0","Cache-Control":"no-cache"})
                  with urllib.request.urlopen(req,timeout=25) as r:
                      data=json.load(r);print("D1_PLAN",json.dumps(data,ensure_ascii=False),flush=True)
                      if data.get("ok"):break
              except urllib.error.HTTPError as e:
                  print("HTTP",e.code,e.read().decode("utf8")[:1000],flush=True)
              except Exception as e:print("ERROR",type(e).__name__,str(e)[:100],flush=True)
              if i<5:time.sleep(10)
          PY

      - name: Link inspector run to GitHub commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          body={"context":"firmsfinder/2026-d1-index-plan",
                "state":"success" if os.environ["GH_JOB_STATUS"]=="success" else "failure",
                "description":"D1 query plan inspection run",
                "target_url":"https://github.com/"+os.environ["GH_REPO"]+"/actions/runs/"+os.environ["GH_RUN_ID"]}
          url="https://api.github.com/repos/"+os.environ["GH_REPO"]+"/statuses/"+os.environ["GH_SHA"]
          req=urllib.request.Request(url,method="POST",data=json.dumps(body).encode(),headers={
            "Authorization":"Bearer "+os.environ["GH_TOKEN"],
            "Accept":"application/vnd.github+json","Content-Type":"application/json",
            "User-Agent":"AiVenture-D1-Inspector"})
          with urllib.request.urlopen(req,timeout=20) as r:print("STATUS",r.status)
          PY
