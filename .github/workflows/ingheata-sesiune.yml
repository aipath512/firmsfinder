# ingheata-sesiune.yml — v1.0 (2026-10-29)
# Locul în GitHub: .github/workflows/ingheata-sesiune.yml
# Pornire: Actions -> ingheata-sesiune -> Run workflow (număr: 0007)
#          sau publicarea unui release cu tag-ul 0007.
name: ingheata-sesiune

on:
  workflow_dispatch:
    inputs:
      numar:
        description: "Numărul sesiunii de înghețat (4 cifre, ex. 0007)"
        required: true
        default: "0007"
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: registru-sesiuni
  cancel-in-progress: false

jobs:
  ingheata:
    runs-on: ubuntu-latest
    steps:
      - name: Descarcă depozitul (ramura principală)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Instalează Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalează clientul OpenTimestamps
        run: pip install opentimestamps-client

      - name: Îngheață sesiunea
        env:
          NUMAR_MANUAL: ${{ github.event.inputs.numar }}
          NUMAR_RELEASE: ${{ github.event.release.tag_name }}
        run: |
          NUMAR="${NUMAR_RELEASE:-$NUMAR_MANUAL}"
          echo "NUMAR=$NUMAR" >> "$GITHUB_ENV"
          python scripts/ingheata_sesiune.py ingheata "$NUMAR"

      - name: Salvează rezultatul în depozit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sesiuni dictionar/latest.json
          git commit -m "Înghețare sesiune ${NUMAR}H"
          git pull --rebase
          git push
