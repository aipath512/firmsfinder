name: ingheata-sesiune

# Trece o sesiune din C (curentă) în H (înghețată): verifică SHA-256, ștampilează cu OpenTimestamps,
# scrie rândul H în sesiuni/registru-sesiuni.json și face commit. Commit-ul pe main declanșează
# publicarea în Cloudflare (integrarea existentă GitHub -> Cloudflare).
#
# Pornire:
#  - manual: Actions -> ingheata-sesiune -> Run workflow -> numărul sesiunii (ex. 0007)
#  - din Releases: creați un release cu tag-ul egal cu numărul sesiunii (ex. 0007)

on:
  workflow_dispatch:
    inputs:
      sesiune:
        description: "Numărul sesiunii de înghețat, 4 cifre (ex. 0007)"
        required: true
      fara_ots:
        description: "Îngheață fără OTS (doar dacă serverele OpenTimestamps nu răspund)"
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: sesiuni-registru
  cancel-in-progress: false

jobs:
  ingheata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalează clientul OpenTimestamps
        run: pip install opentimestamps-client
      - name: Înghețare C -> H
        env:
          SESIUNE: ${{ github.event.inputs.sesiune || github.event.release.tag_name }}
          FARA_OTS: ${{ github.event.inputs.fara_ots }}
        run: |
          if [ "$FARA_OTS" = "true" ]; then
            python scripts/ingheata_sesiune.py --ingheata "$SESIUNE" --fara-ots
          else
            python scripts/ingheata_sesiune.py --ingheata "$SESIUNE"
          fi
      - name: Commit
        env:
          SESIUNE: ${{ github.event.inputs.sesiune || github.event.release.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sesiuni/registru-sesiuni.json
          git add dictionar/latest.json
          git add dictionar/*.ots || true
          git commit -m "Sesiune ${SESIUNE}H înghețată (SHA-256 + OTS)"
          git push origin HEAD:main
