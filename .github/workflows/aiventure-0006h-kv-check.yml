name: AiVenture 0006H Cloudflare KV access check
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/aiventure-0006h-kv-check.yml'
permissions:
  contents: read
jobs:
  kv-access:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check required secrets are present (never print values)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN missing"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::CLOUDFLARE_ACCOUNT_ID missing"; exit 1; }
          echo "Cloudflare secret names available; values are not printed."
      - name: Check Cloudflare KV namespace listing permissions (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 kv namespace list --json > /tmp/kv-list.json
          node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('/tmp/kv-list.json','utf8')); console.log('KV access OK; namespaces visible:', Array.isArray(a)?a.length:'unknown');"
